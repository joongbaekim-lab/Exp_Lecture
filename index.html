<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>열유체공학실험 · 보고서 열람실</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;
  background:linear-gradient(135deg,#0B5463 0%,#1892A0 60%,#7A4A14 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.box{background:#fff;border-radius:16px;padding:2.5rem 2rem;max-width:420px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center}
.icon{font-size:2.8rem;margin-bottom:.75rem}
.univ{font-size:.75rem;color:#8DA4AE;margin-bottom:.2rem}
.dept{font-size:.82rem;color:#46606B;margin-bottom:.3rem}
h1{font-size:1.25rem;font-weight:700;color:#18262C;margin-bottom:1.75rem;line-height:1.4}
.links{display:flex;flex-direction:column;gap:.75rem}
a{display:block;padding:.85rem 1.25rem;border-radius:10px;text-decoration:none;
  font-weight:600;font-size:.95rem;transition:opacity .15s}
.a1{background:linear-gradient(108deg,#0B5463,#1892A0);color:#fff}
.a2{background:linear-gradient(108deg,#1892A0,#0e7a88);color:#fff}
a:hover{opacity:.85}
.sub{font-size:.75rem;font-weight:400;opacity:.8;display:block;margin-top:.2rem}
</style>
</head>
<body>
<div class="box">
  <div class="icon">🌡️</div>
  <div class="univ">국립공주대학교</div>
  <div class="dept">기계자동차공학부 기계공학전공</div>
  <h1>열유체공학실험<br>보고서 열람실</h1>
  <div class="links">
    <a class="a1" href="열람실1/">
      📋 보고서 열람실 #1
      <span class="sub">열람실1 바로가기</span>
    </a>
    <a class="a2" href="열람실2/">
      📋 보고서 열람실 #2
      <span class="sub">열람실2 바로가기</span>
    </a>
  </div>
</div>
</body>
</html>
